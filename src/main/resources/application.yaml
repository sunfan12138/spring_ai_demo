spring:
  application:
    name: spring_ai_demo
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://172.16.40.244:3307/spring_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  ai:
    # OpenAI 配置（兼容智谱 AI）
    openai:
      # API 密钥配置：从环境变量读取，如果未设置则使用默认值（请替换为你的实际 API 密钥）
      api-key: ${MODELSCOPE_API_KEY}
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3.2
        completions-path: /v1/chat/completions
      base-url: https://api-inference.modelscope.cn/

    # 重试配置（处理 429 限流错误）
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        max-interval: 30s
        multiplier: 2
      on-client-errors: false  # 4xx 错误不重试（包括 429）
      exclude-on-http-codes: 401,403  # 排除这些错误码的重试
    
    # 聊天记忆 JDBC 存储配置
    chat:
      memory:
        repository:
          jdbc:
            # 控制何时初始化 schema: embedded(仅嵌入式数据库), always(总是), never(从不)
            initialize-schema: always
            # Schema 脚本位置（可选，使用默认值）
            # schema: classpath:org/springframework/ai/chat/memory/repository/jdbc/schema-@@platform@@.sql
            # 平台名称（如果使用 @@platform@@ 占位符，可选，默认自动检测）
            # platform: mysql
    
    # MCP 服务器配置
    # 注意：根据 ModelScope MCP 服务的特性，使用 SSE 传输
    # URL 分割：
    # - 完整 URL: https://mcp.api-inference.modelscope.net/31fb155e7b7843/mcp
    # - 基本 URL: https://mcp.api-inference.modelscope.net
    # - SSE 端点: /31fb155e7b7843/mcp
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 30s
        toolcallback:
          enabled: true
        sse:
          connections:
            open-webSearch:
              url: https://mcp.api-inference.modelscope.net
              sse-endpoint: /1b30a3a7c6f94b/sse
    
    # Milvus 向量存储配置（知识库）
    # 启动 Milvus 后再上传文档，否则会提示「知识库服务不可用」
    # 本地启动: docker compose -f docker-compose-milvus.yml up -d
    # 或下载官方: wget https://github.com/milvus-io/milvus/releases/download/v2.6.4/milvus-standalone-docker-compose.yml -O docker-compose-milvus.yml
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: root
          password: milvus
        database-name: default
        collection-name: knowledge_base
        initialize-schema: true
        embedding-dimension: 512
        # --- 关键优化部分 ---
        index-type: HNSW  # 将 IVF_FLAT 改为 HNSW
        metric-type: COSINE  # BGE 模型必须使用 COSINE
        # HNSW 的核心参数：
        # M: 每个节点的最大邻居数，范围 4-64，越大精度越高但内存消耗也越大
        # efConstruction: 构建索引时的搜索范围，范围 8-512，越大索引质量越高
        index-parameters: '{"M":16, "efConstruction":128}'

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    # Spring AI SimpleLoggerAdvisor 日志级别（需要设置为 DEBUG 才能看到日志）
    org.springframework.ai.chat.client.advisor: DEBUG
    # MCP 工具调用相关日志
    org.springframework.ai.mcp: DEBUG
    org.springframework.ai.model.tool: DEBUG
    com.ifoodbuy.spring_ai_demo.tool: DEBUG
    # 或者设置为根级别 DEBUG（如果上面的配置不生效）
    root: INFO
    # 项目日志级别
    com.ifoodbuy.spring_ai_demo: INFO
